name: Build and deploy the encyclopaedia

# Published at https://topologicaldynamics.org (GitHub Pages, custom domain):
#   /        the MyST version, built with mystmd (the newer MyST engine)
#   /latex/  the LaTeX version (permanent tags, dependency graph, PDF)
# The Sphinx build of the MyST files is still run as a check but not published.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            graphviz libgraphviz-dev librsvg2-bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install plastex plastexdepgraph beautifulsoup4 \
            sphinx myst-parser sphinx-proof sphinx-book-theme sphinxcontrib-bibtex sphinx-tippy

      - name: Check that every LaTeX label has a permanent tag
        run: python3 latex/tools/tags.py check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build MyST version with mystmd (site root)
        working-directory: myst
        run: |
          npm install -g mystmd
          python3 tools/source_links.py
          python3 tools/site_map.py
          myst build --html
          git checkout -- .
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -r _build/html/. "$GITHUB_WORKSPACE/_site/"
          rm -rf _build

      - name: Build LaTeX version (website and PDF) at /latex/
        run: ./latex/build.sh "$PWD/_site/latex"

      - name: Check that no raw TeX shows on the built site
        run: python3 latex/tools/check_site.py _site

      - name: Check the Sphinx build of the MyST files (not published)
        run: ./myst/build.sh "$RUNNER_TEMP/sphinx-check"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
