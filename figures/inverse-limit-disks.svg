<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="220" viewBox="0 0 680 220" role="img" aria-label="The disks D_j, D_(j+1), D_(j+2) with the groups K_n acting on them and the maps p_n between them, their inverse limit X with the action of G, and the projection from X to D_j">
<title>The disks D_j, D_(j+1), D_(j+2) with the groups K_n acting on them and the maps p_n between them, their inverse limit X with the action of G, and the projection from X to D_j</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25303b"/></marker></defs>
<g font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="17" fill="#25303b">
<circle cx="110.0" cy="110.0" r="40" fill="#dbe6f7" stroke="#2f63b8" stroke-width="1.6"/>
<text x="110.0" y="116.0" font-size="18" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="13" font-style="italic">j</tspan></text>
<path d="M84,58 A30,14 0 1 1 136,58" fill="none" stroke="#25303b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="110.0" y="36.0" font-size="16" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="11" font-style="italic">j</tspan></text>
<circle cx="250.0" cy="110.0" r="40" fill="#dbe6f7" stroke="#2f63b8" stroke-width="1.6"/>
<text x="250.0" y="116.0" font-size="18" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="13" font-style="italic">j+1</tspan></text>
<path d="M224,58 A30,14 0 1 1 276,58" fill="none" stroke="#25303b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="250.0" y="36.0" font-size="16" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="11" font-style="italic">j+1</tspan></text>
<circle cx="390.0" cy="110.0" r="40" fill="#dbe6f7" stroke="#2f63b8" stroke-width="1.6"/>
<text x="390.0" y="116.0" font-size="18" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">D</tspan><tspan baseline-shift="sub" font-size="13" font-style="italic">j+2</tspan></text>
<path d="M364,58 A30,14 0 1 1 416,58" fill="none" stroke="#25303b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="390.0" y="36.0" font-size="16" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="11" font-style="italic">j+2</tspan></text>
<text x="180.0" y="36.0" font-size="16" text-anchor="middle" fill="#5d6873" font-weight="normal">⊂</text>
<text x="320.0" y="36.0" font-size="16" text-anchor="middle" fill="#5d6873" font-weight="normal">⊂</text>
<text x="462.0" y="36.0" font-size="16" text-anchor="middle" fill="#5d6873" font-weight="normal">⊂ …</text>
<line x1="204.0" y1="110.0" x2="156.0" y2="110.0" stroke="#25303b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="180.0" y="102.0" font-size="15" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">j</tspan></text>
<line x1="344.0" y1="110.0" x2="296.0" y2="110.0" stroke="#25303b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="320.0" y="102.0" font-size="15" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">p</tspan><tspan baseline-shift="sub" font-size="10" font-style="italic">j+1</tspan></text>
<line x1="474.0" y1="110.0" x2="436.0" y2="110.0" stroke="#25303b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="490.0" y="116.0" font-size="18" text-anchor="start" fill="#5d6873" font-weight="normal">…</text>
<ellipse cx="600.0" cy="110.0" rx="52.0" ry="40.0" fill="#f8e3d2" fill-opacity="1" stroke="#c4661f" stroke-width="1.6"/>
<text x="600.0" y="116.0" font-size="19" text-anchor="middle" fill="#25303b" font-weight="normal" font-style="italic">X</text>
<path d="M574,58 A30,14 0 1 1 626,58" fill="none" stroke="#25303b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="600.0" y="36.0" font-size="16" text-anchor="middle" fill="#25303b" font-weight="normal"><tspan font-style="italic">G</tspan> = ⋃ <tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="11" font-style="italic">n</tspan></text>
<path d="M564,139 C480,188 240,188 146,134" fill="none" stroke="#c4661f" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="370.0" y="202.0" font-size="14" text-anchor="middle" fill="#c4661f" font-weight="normal">the projection is <tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="9" font-style="italic">j</tspan>-equivariant</text>
<text x="96.0" y="172.0" font-size="13" text-anchor="middle" fill="#5d6873" font-weight="normal">no <tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="8" font-style="italic">j</tspan>-fixed point</text>
<text x="606.0" y="172.0" font-size="13" text-anchor="middle" fill="#5d6873" font-weight="normal">so no <tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="8" font-style="italic">j</tspan>-fixed point,</text>
<text x="606.0" y="189.0" font-size="13" text-anchor="middle" fill="#5d6873" font-weight="normal">and no <tspan font-style="italic">G</tspan>-fixed point</text>
</g>
</svg>
