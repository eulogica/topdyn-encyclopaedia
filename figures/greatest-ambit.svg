<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="270" viewBox="0 0 680 270" role="img" aria-label="The greatest ambit S(G), with G dense in it, and its morphism onto an ambit (X, x0), sending 1 to x0 and g to gx0">
<title>The greatest ambit S(G), with G dense in it, and its morphism onto an ambit (X, x0), sending 1 to x0 and g to gx0</title>
