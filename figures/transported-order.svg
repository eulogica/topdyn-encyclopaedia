<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="280" viewBox="0 0 680 280" role="img" aria-label="A linear order on the numbers 1 to 6, listed from least to greatest, and the order transported by a permutation g, which lists g(a) where the first order lists a">
