<text x="619.0" y="118.0" font-size="16" text-anchor="start" fill="#25303b" font-weight="normal" font-style="italic">x′</text>
<path d="M485,90 C535,55 570,80 601,117" fill="none" stroke="#c4661f" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="553.0" y="64.0" font-size="15" text-anchor="middle" fill="#c4661f" font-weight="normal"><tspan font-style="italic">gθ</tspan> ↦ <tspan font-style="italic">gx′</tspan></text>
<text x="553.0" y="236.0" font-size="15" text-anchor="middle" fill="#5d6873" font-weight="normal">(b) onto every minimal flow</text>
