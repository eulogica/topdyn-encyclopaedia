<line x1="292.0" y1="130.0" x2="402.0" y2="130.0" stroke="#25303b" stroke-width="2"/>
<circle cx="292.0" cy="130.0" r="5" fill="#c4661f" stroke="#c4661f" stroke-width="1.5"/>
<circle cx="402.0" cy="130.0" r="5" fill="#c4661f" stroke="#c4661f" stroke-width="1.5"/>
<text x="292.0" y="155.0" font-size="17" text-anchor="middle" fill="#25303b" font-weight="normal" font-style="italic">θ</text>
