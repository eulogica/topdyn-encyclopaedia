<path d="M360,118 Q373,106 386,116" fill="none" stroke="#2f63b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="236.0" font-size="15" text-anchor="middle" fill="#5d6873" font-weight="normal">(a) the stabiliser of <tspan font-style="italic">θ</tspan> ≅ Homeo<tspan baseline-shift="sub" font-size="11">+</tspan>[0, 1]</text>
<circle cx="480.0" cy="130.0" r="38" fill="none" stroke="#25303b" stroke-width="1.8"/>
<circle cx="480.0" cy="92.0" r="4" fill="#c4661f" stroke="#c4661f" stroke-width="1.5"/>
