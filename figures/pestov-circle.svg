<text x="480.0" y="192.0" font-size="17" text-anchor="middle" fill="#25303b" font-weight="normal" font-style="italic">𝕊<tspan baseline-shift="super" font-size="11">1</tspan></text>
<ellipse cx="615.0" cy="130.0" rx="50.0" ry="40.0" fill="none" fill-opacity="1" stroke="#25303b" stroke-width="1.8"/>
