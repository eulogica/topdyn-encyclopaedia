<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="The circle cut at a point theta becomes an interval, and the map from the circle to a flow X sending g theta to g x'">
<title>The circle cut at a point theta becomes an interval, and the map from the circle to a flow X sending g theta to g x'</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25303b"/></marker></defs>
<g font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="17" fill="#25303b">
